<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интеллект-карта</title>
<link rel="icon" type="image/jpeg" href="icon.jpg">
<meta name="description" content="Интерактивная интеллект-карта: создавайте центр, ветви и узлы с нуля, перемещайте их свободно и сохраняйте.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif;
  background:#0a0e16;color:#eaf2ff}
#board{position:fixed;inset:0;cursor:grab;overflow:hidden;touch-action:none;
  background:
    radial-gradient(900px 600px at 20% 10%, rgba(40,90,180,.10), transparent 60%),
    radial-gradient(900px 700px at 85% 85%, rgba(90,70,180,.08), transparent 60%),
    #0a0e16}
#board.panning{cursor:grabbing}
#world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#svgLayer{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.node{position:absolute;min-width:80px;max-width:200px;background:#151d2e;border:1.5px solid #2c3f66;
  border-radius:12px;padding:8px 14px;cursor:grab;box-shadow:0 3px 14px rgba(0,0,0,.5);
  color:#eaf2ff;font-size:14px;line-height:1.25;text-align:center;touch-action:none;
  transition:box-shadow .2s,border-color .2s}
.node:hover{box-shadow:0 0 18px rgba(80,140,255,.3);border-color:#5aa2ff}
.node.selected{box-shadow:0 0 0 2px #5aa2ff,0 0 24px rgba(90,170,255,.45)}
.node.dragging{cursor:grabbing;z-index:60;box-shadow:0 0 30px rgba(90,170,255,.5)}
.node.root{font-weight:800;font-size:17px;border-width:2px;border-color:#e0a800;background:#2a2308;color:#ffd75e}
.node .ops{position:absolute;top:-9px;right:-9px;display:none;gap:4px}
.node:hover .ops{display:flex}
.node .ops button{width:21px;height:21px;border-radius:50%;border:1px solid #3a4a6b;background:#0f1726;
  color:#cfd9ec;cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
.node .ops .del{color:#ff5b6d;border-color:#ff5b6d}

#toolbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:8px;
  align-items:center;background:rgba(13,19,32,.92);backdrop-filter:blur(8px);border:1px solid #24344f;
  border-radius:14px;padding:8px 12px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#toolbar button{border:1px solid #31435f;background:#13203a;color:#cfe0ff;border-radius:9px;padding:9px 14px;
  font-size:13px;font-weight:600;cursor:pointer;transition:all .18s}
#toolbar button:hover{background:#1c3157;border-color:#5aa2ff}
#toolbar button:disabled{opacity:.4;cursor:not-allowed}
#toolbar .zoom{display:flex;gap:4px}
#toolbar .zoom button{width:34px;padding:9px 0;font-weight:700}
#toolbar span{color:#8296bd;font-size:12px;min-width:44px;text-align:center}

#emptyCover{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;gap:18px;
  align-items:center;justify-content:center;text-align:center;pointer-events:none}
#emptyCover .big{font-size:22px;font-weight:800;letter-spacing:1px;color:#bcd3ff}
#emptyCover p{color:#8296bd;font-size:14px;max-width:420px;line-height:1.6}

.credit{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:20;
  font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:#8296bd;
  text-shadow:0 0 6px rgba(0,0,0,.9)}
.hint{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:20;
  font-size:12px;color:#8fa3c8;background:rgba(10,14,22,.85);border:1px solid #24344f;
  padding:5px 14px;border-radius:20px;white-space:nowrap}
#devBadge{position:fixed;top:14px;right:20px;z-index:30;
  font-size:11px;letter-spacing:.6px;text-transform:uppercase;font-weight:600;
  color:#ffd28a;background:rgba(255,170,60,.12);border:1px solid rgba(255,190,90,.5);
  border-radius:20px;padding:7px 16px;animation:breathe 2.4s ease-in-out infinite;
  pointer-events:none}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1;box-shadow:0 0 18px rgba(255,170,60,.35)}}
</style>
</head>
<body>
<div id="board"><div id="world"><svg id="svgLayer"></svg></div></div>

<div id="toolbar">
  <button id="addRoot">＋ Корень</button>
  <button id="addChild">＋ Узел к выбранному</button>
  <div class="zoom"><button id="zIn">＋</button><button id="fit">по размеру</button><button id="zOut">−</button><span id="zp">100%</span></div>
</div>

<div id="emptyCover">
  <div class="big">Пустая карта</div>
  <p>Нажмите «＋ Корень», чтобы создать центральный узел.<br>
  Потом выбирайте узел и жмите «＋ Узел к выбранному», чтобы добавить ветвь.</p>
</div>

<div id="devBadge">В процессе разработки</div>

<div class="hint">клик по узлу — выбрать · двойной клик — переименовать · ✕ — удалить · перетаскивайте узлы, зум колесом</div>
<div class="credit">Автор разработки: Линкольн</div>

<script>
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const board=$("#board"),world=$("#world"),svg=$("#svgLayer"),emptyCover=$("#emptyCover");
let zoom=1,panX=0,panY=0;
let nodes=[],seq=1,selectedId=null;
const STORE="mindmap2_doc";
function saveAll(){ try{ localStorage.setItem(STORE,JSON.stringify({zoom,panX,panY,nodes,selectedId})); }catch(e){} }
function loadAll(){ let d=null; try{ d=JSON.parse(localStorage.getItem(STORE)); }catch(e){} return d; }
function nid(){ return "n"+(seq++); }
function byID(id){ return nodes.find(n=>n.id===id); }

function render(){
  // lines
  let s="";
  nodes.forEach(n=>{ if(n.parent!=null){ const p=byID(n.parent); if(p){
    const a=p,b=n, mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,off=Math.max(12,Math.min(30,len*.12));
    const col=(a.kind==="root"||b.kind==="root")?"#e0a800":"#5aa2ff";
    s+=`<path d="M${a.x},${a.y} C${mx-nx*off},${my-ny*off} ${mx+nx*off},${my+ny*off} ${b.x},${b.y}" fill="none" stroke="${col}" stroke-width="2" opacity=".85"/>`;
  } } });
  svg.setAttribute("width",innerWidth*2);svg.setAttribute("height",innerHeight*2);svg.innerHTML=s;
  // nodes
  const frag=document.createDocumentFragment();
  nodes.forEach(n=>frag.appendChild(nodeEl(n)));
  world.querySelectorAll(".node").forEach(x=>x.remove());
  world.insertBefore(frag,svg);
  applyView();
  emptyCover.style.display=nodes.length?"none":"flex";
  $("#addRoot").disabled=!!nodes.length;
  $("#addChild").disabled=!selectedId;
}
function nodeEl(n){
  const el=document.createElement("div");
  el.className="node "+(n.kind||"leaf")+(n.id===selectedId?" selected":"");
  el.dataset.id=n.id; el.style.left=n.x+"px"; el.style.top=n.y+"px";
  const label=document.createElement("div"); label.textContent=n.txt; el.appendChild(label);
  makeDrag(el,n);
  el.addEventListener("click",()=>{ selectedId=n.id; render(); });
  el.addEventListener("dblclick",()=>{
    const nn=prompt("Переименовать:",n.txt); if(nn!==null&&nn.trim()){ n.txt=nn.trim(); saveAll(); render(); }
  });
  const ops=document.createElement("div"); ops.className="ops";
  const del=document.createElement("button"); del.className="del"; del.textContent="✕"; del.title="Удалить узел и ветви";
  del.addEventListener("click",ev=>{ ev.stopPropagation();
    if(!confirm("Удалить узел и все его ответвления?")) return;
    removeSubtree(n.id); if(selectedId===n.id) selectedId=null; saveAll(); render();
  });
  ops.appendChild(del); el.appendChild(ops);
  return el;
}
function removeSubtree(id){
  const doomed=new Set();
  const pending=[id];
  while(pending.length){
    const cur=pending.shift();
    if(doomed.has(cur)) continue;
    doomed.add(cur);
    nodes.forEach(n=>{ if(n.parent===cur) pending.push(n.id); });
  }
  nodes=nodes.filter(n=>!doomed.has(n.id));
}
function setRoot(){
  const t=prompt("Название центра:","Центральная тема");
  if(t===null) return;
  nodes=[{id:nid(),kind:"root",parent:null,x:innerWidth/2,y:innerHeight/2,txt:(t.trim()||"Центральная тема")}];
  selectedId=nodes[0].id; panX=0;panY=0;zoom=1; saveAll(); render(); $("#fit").click();
}
function addChildToSelected(){
  const p=byID(selectedId); if(!p) return;
  const t=prompt("Название узла:","Идея");
  if(t===null) return;
  const ang=Math.random()*Math.PI*2, dist=170+Math.random()*40;
  const n={id:nid(),kind:"leaf",parent:p.id,x:p.x+Math.cos(ang)*dist,y:p.y+Math.sin(ang)*dist,txt:(t.trim()||"Идея")};
  nodes.push(n); saveAll(); render();
}
function makeDrag(el,n){
  let sx,sy,ox,oy,d=false;
  el.addEventListener("pointerdown",ev=>{
    if(ev.target.closest(".ops"))return;
    d=true;sx=ev.clientX;sy=ev.clientY;ox=n.x;oy=n.y;
    el.classList.add("dragging"); el.setPointerCapture(ev.pointerId);
  });
  el.addEventListener("pointermove",ev=>{ if(!d)return;
    n.x=ox+(ev.clientX-sx)/zoom; n.y=oy+(ev.clientY-sy)/zoom;
    el.style.left=n.x+"px"; el.style.top=n.y+"px"; drawLinesOnly();
  });
  el.addEventListener("pointerup",()=>{ if(!d)return; d=false; el.classList.remove("dragging"); saveAll(); render(); });
}
function drawLinesOnly(){
  let s="";
  nodes.forEach(n=>{ if(n.parent!=null){ const p=byID(n.parent); if(p){
    const a=p,b=n,mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,off=Math.max(12,Math.min(30,len*.12));
    const col=(a.kind==="root"||b.kind==="root")?"#e0a800":"#5aa2ff";
    s+=`<path d="M${a.x},${a.y} C${mx-nx*off},${my-ny*off} ${mx+nx*off},${my+ny*off} ${b.x},${b.y}" fill="none" stroke="${col}" stroke-width="2" opacity=".85"/>`;
  } } });
  svg.innerHTML=s;
}
function applyView(){ world.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`; $("#zp").textContent=Math.round(zoom*100)+"%"; }
function viewX(vx){return (vx-panX)/zoom;} function viewY(vy){return (vy-panY)/zoom;}
function zoomAt(fz,cx,cy){ const wx=viewX(cx),wy=viewY(cy); zoom=Math.max(.2,Math.min(3,fz)); panX=cx-wx*zoom; panY=cy-wy*zoom; applyView(); }

let ps=false,psx=0,psy=0,ppx=0,ppy=0;
board.addEventListener("pointerdown",ev=>{ if(ev.target.closest(".node"))return; ps=true;psx=ev.clientX;psy=ev.clientY;ppx=panX;ppy=panY;board.classList.add("panning");board.setPointerCapture(ev.pointerId);});
board.addEventListener("pointermove",ev=>{ if(!ps)return; panX=ppx+(ev.clientX-psx);panY=ppy+(ev.clientY-psy);applyView();});
board.addEventListener("pointerup",()=>{ps=false;board.classList.remove("panning");});
board.addEventListener("wheel",ev=>{ ev.preventDefault(); zoomAt(zoom*Math.pow(1.15,-Math.sign(ev.deltaY)),ev.clientX,ev.clientY); },{passive:false});
$("#zIn").addEventListener("click",()=>zoomAt(zoom*1.2,innerWidth/2,innerHeight/2));
$("#zOut").addEventListener("click",()=>zoomAt(zoom*.85,innerWidth/2,innerHeight/2));
$("#fit").addEventListener("click",()=>{ if(!nodes.length)return; const r=nodes[0]; zoom=1; panX=innerWidth/2-r.x; panY=innerHeight/2-r.y; applyView(); });
$("#addRoot").addEventListener("click",setRoot);
$("#addChild").addEventListener("click",addChildToSelected);
addEventListener("resize",()=>{svg.setAttribute("width",innerWidth*2);svg.setAttribute("height",innerHeight*2);render();});

const saved=loadAll();
if(saved&&saved.nodes&&saved.nodes.length){ nodes=saved.nodes; zoom=saved.zoom||1; panX=saved.panX||0; panY=saved.panY||0; selectedId=saved.selectedId||null; seq=nodes.length+2; }
if(nodes.length){ seq=nodes.reduce((m,n)=>{const v=parseInt((n.id||"").slice(1));return v>m?v:m;},0)+1; }
render();
if(nodes.length) $("#fit").click();
</script>
</body>
</html>
