<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интеллект-карта</title>
<link rel="icon" type="image/jpeg" href="icon.jpg">
<meta name="description" content="Интерактивная интеллект-карта: темы, ветви и узлы, которые можно создавать, переименовывать, перетаскивать и сохранять.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#0a0e16;color:#eaf2ff}
#board{position:fixed;inset:0;cursor:grab;overflow:hidden;touch-action:none;
  background:
    radial-gradient(900px 600px at 20% 10%, rgba(40,90,180,.10), transparent 60%),
    radial-gradient(900px 700px at 85% 85%, rgba(90,70,180,.08), transparent 60%),
    #0a0e16}
#board.panning{cursor:grabbing}
#world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#svgLayer{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.node{position:absolute;min-width:80px;max-width:200px;background:#151d2e;border:1.5px solid #2c3f66;
  border-radius:12px;padding:8px 14px;cursor:grab;box-shadow:0 3px 14px rgba(0,0,0,.5);
  color:#eaf2ff;font-size:14px;line-height:1.25;text-align:center;touch-action:none;
  transition:box-shadow .2s,border-color .2s}
.node:hover{box-shadow:0 0 18px rgba(80,140,255,.3),0 6px 20px rgba(0,0,0,.5);border-color:#5aa2ff}
.node.dragging{cursor:grabbing;z-index:60;box-shadow:0 0 30px rgba(90,170,255,.45)}
.node.root{font-weight:800;font-size:17px;border-width:2px;border-color:#e0a800;background:#2a2308;color:#ffd75e}
.node.branch{font-weight:700;border-color:#0aa5c9;background:#06262e;color:#6be6ff}
.node.round{border-radius:50%;display:flex;align-items:center;justify-content:center;
  width:52px;height:52px;min-width:52px;max-width:52px;padding:6px;font-size:11px;line-height:1.1;
  word-break:break-word;overflow:hidden}
.node .note{font-size:11px;color:#7c8db0;margin-top:2px}
.node .ops{position:absolute;top:-9px;right:-9px;display:none;gap:4px}
.node:hover .ops{display:flex}
.node .ops button{width:21px;height:21px;border-radius:50%;border:1px solid #3a4a6b;background:#0f1726;
  color:#cfd9ec;cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
.node .ops .add{color:#3ddc84;border-color:#3ddc84}
.node .ops .del{color:#ff5b6d;border-color:#ff5b6d}

#toolbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:8px;
  align-items:center;background:rgba(14,20,33,.92);backdrop-filter:blur(8px);border:1px solid #24344f;
  border-radius:14px;padding:8px 12px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#toolbar button{border:1px solid #31435f;background:#13203a;color:#cfe0ff;border-radius:9px;padding:8px 14px;
  font-size:13px;font-weight:600;cursor:pointer;transition:all .18s}
#toolbar button:hover{background:#1c3157;border-color:#5aa2ff}
#toolbar .zoom{display:flex;gap:4px}
#toolbar .zoom button{width:34px;padding:8px 0;font-weight:700}
#toolbar span{color:#8296bd;font-size:12px;min-width:44px;text-align:center}
#titleInput{border:1px solid #31435f;border-radius:9px;padding:8px 12px;font-size:14px;font-weight:700;
  color:#eaf2ff;background:#0d1528;outline:none;width:200px}
#titleInput:focus{border-color:#5aa2ff}

.credit{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:20;
  font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:#8296bd;
  text-shadow:0 0 6px rgba(0,0,0,.9)}
.hint{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:20;
  font-size:12px;color:#8fa3c8;background:rgba(10,14,22,.85);border:1px solid #24344f;
  padding:5px 14px;border-radius:20px;white-space:nowrap}
</style>
</head>
<body>
<div id="board"><div id="world">
<svg id="svgLayer"></svg>
</div></div>
<div id="toolbar">
  <input id="titleInput" value="Тема" aria-label="Название темы">
  <div class="zoom"><button id="zIn">＋</button><button id="fit">по размеру</button><button id="zOut">−</button><span id="zp">100%</span></div>
  <button id="addBranch">＋ ветвь</button>
</div>
<div class="hint">клик по узлу — переименовать · ＋ — добавить узел · ✕ — удалить · перетаскивайте, зум колесом</div>
<div class="credit">Автор разработки: Линкольн</div>

<script>
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const board=$("#board"),world=$("#world"),svg=$("#svgLayer");
let zoom=1,panX=60,panY=60;
let nodes=[],root=null;
const STORE="mindmap_doc";
function saveAll(){ try{ localStorage.setItem(STORE,JSON.stringify({title:$("#titleInput").value,zoom,panX,panY,nodes,rootId:root&&root.id})); }catch(e){} }
let loaded=false;
function loadAll(){ try{ const d=JSON.parse(localStorage.getItem(STORE)); if(d&&d.rootId){ loaded=true; nodes=d.nodes||[]; zoom=d.zoom||1; panX=d.panX!==undefined?d.panX:60; panY=d.panY!==undefined?d.panY:60; if(d.title)$("#titleInput").value=d.title; root=byID(d.rootId); } }catch(e){} }
let seq=1; function nid(){return "n"+(seq++);}
function fontOf(kind){return kind==="root"?20:kind==="branch"?17:15;}
// seed
function seed(){
  nodes=[];
  root={id:nid(),kind:"root",x:innerWidth/2,y:innerHeight/2,txt:"Центральная тема",children:[]};
  const b1={id:nid(),kind:"branch",txt:"Ветвь 1",children:[{id:nid(),kind:"leaf",txt:"Идея 1a"},{id:nid(),kind:"leaf",txt:"Идея 1b"}]};
  const b2={id:nid(),kind:"branch",txt:"Ветвь 2",children:[{id:nid(),kind:"leaf",txt:"Идея 2a"}]};
  root.children=[b1,b2];
}
function byID(id){ return nodes.find(n=>n.id===id); }
function layoutBranch(b,angle,centerX,centerY){
  const r1=150;
  const bx=centerX+Math.cos(angle)*r1, by=centerY+Math.sin(angle)*r1;
  b.x=bx; b.y=by;
  const count=b.children.length||1;
  b.children.forEach((c,ci)=>{
    const spread=0.6;
    const a2=angle+(ci-(count-1)/2)*spread;
    const r2=r1+120;
    c.x=centerX+Math.cos(a2)*r2; c.y=centerY+Math.sin(a2)*r2;
  });
}
function relayout(){
  const cx=root.x, cy=root.y;
  const n=root.children.length||1;
  root.children.forEach((b,i)=>{
    layoutBranch(b,(i/n)*Math.PI*2-Math.PI/2,cx,cy);
  });
}
function allNodes(){ const out=[]; function walk(n){out.push(n);(n.children||[]).forEach(walk);} walk(root); return out; }
function render(doLayout){
  if(root && doLayout) relayout();
  nodes=allNodes();
  const lines=[];
  function walk(n){
    (n.children||[]).forEach(c=>{ lines.push([n,c]); walk(c); });
  }
  walk(root);
  let s="";
  lines.forEach(([a,b])=>{
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const dx=b.x-a.x, dy=b.y-a.y; const len=Math.hypot(dx,dy)||1;
    const nx=-dy/len, ny=dx/len;
    const off=Math.max(10,Math.min(26,len*.12));
    const c1x=mx-nx*off,c1y=my-ny*off, c2x=mx+nx*off,c2y=my+ny*off;
    const col=a.kind==="root"||b.kind==="root"?"#e0a800":(a.kind==="branch"||b.kind==="branch"?"#0aa5c9":"#7aa6ef");
    s+=`<path d="M${a.x},${a.y} C${c1x},${c1y} ${c2x},${c2y} ${b.x},${b.y}" fill="none" stroke="${col}" stroke-width="${a.kind==='root'||b.kind==='root'?3:2}" opacity=".85"/>`;
  });
  svg.setAttribute("width",innerWidth*2);svg.setAttribute("height",innerHeight*2);
  svg.innerHTML=s;
  const frag=document.createDocumentFragment();
  nodes.forEach(n=>{ frag.appendChild(nodeEl(n)); });
  world.querySelectorAll(".node").forEach(x=>x.remove());
  world.insertBefore(frag,svg);
  applyView();
}
function nodeEl(n){
  const el=document.createElement("div");
  el.className="node "+n.kind+(n.kind==="branch"?" round":"")+""; el.dataset.id=n.id;
  el.style.left=n.x+"px"; el.style.top=n.y+"px";
  const chip=document.createElement("div"); chip.className="chip";
  el.textContent="";
  const label=document.createElement("div"); label.textContent=n.txt;
  el.appendChild(label);
  // handlers
  makeDrag(el,n);
  el.addEventListener("dblclick",()=>{
    const nn=prompt("Переименовать:",n.txt); if(nn!==null&&nn.trim()){n.txt=nn.trim();saveAll();render(false);}
  });
  const ops=document.createElement("div"); ops.className="ops";
  if(n.kind!=="leaf"){
    const a=document.createElement("button"); a.className="add"; a.textContent="＋"; a.title="Добавить узел";
    a.addEventListener("click",ev=>{ev.stopPropagation();
      const t=prompt("Название нового узла:","Идея");
      if(t&&t.trim()){ n.children=n.children||[]; n.children.push({id:nid(),kind:"leaf",txt:t.trim()}); saveAll(); render(true); }
    });
    ops.appendChild(a);
  }
  const del=document.createElement("button"); del.className="del"; del.textContent="✕"; del.title="Удалить узел";
  del.addEventListener("click",ev=>{ev.stopPropagation();
    if(!confirm("Удалить узел?")) return;
    removeNode(el.dataset.id); saveAll(); render(true);
  });
  ops.appendChild(del);
  el.appendChild(ops);
  return el;
}
function removeNode(id){
  function walk(n){ n.children=(n.children||[]).filter(c=>c.id!==id); n.children.forEach(walk); }
  if(root.id===id) return; walk(root);
}
function makeDrag(el,n){
  let sx,sy,ox,oy,d=false;
  el.addEventListener("pointerdown",ev=>{
    if(ev.target.closest(".ops"))return;
    d=true;sx=ev.clientX;sy=ev.clientY;ox=n.x;oy=n.y;
    el.classList.add("dragging"); el.setPointerCapture(ev.pointerId);
  });
  el.addEventListener("pointermove",ev=>{ if(!d)return;
    n.x=ox+(ev.clientX-sx)/zoom; n.y=oy+(ev.clientY-sy)/zoom;
    el.style.left=n.x+"px"; el.style.top=n.y+"px"; applyView(true);
  });
  el.addEventListener("pointerup",()=>{ if(!d)return; d=false; el.classList.remove("dragging"); saveAll(); render(false); });
}
function applyView(keep){
  world.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
  $("#zp").textContent=Math.round(zoom*100)+"%";
}
function viewX(vx){return (vx-panX)/zoom;} function viewY(vy){return (vy-panY)/zoom;}
function zoomAt(fz,cx,cy){ const wx=viewX(cx),wy=viewY(cy); zoom=Math.max(.2,Math.min(3,fz)); panX=cx-wx*zoom; panY=cy-wy*zoom; applyView(); }
// pan
let ps=false,psx=0,psy=0,ppx=0,ppy=0;
board.addEventListener("pointerdown",ev=>{ if(ev.target.closest(".node"))return; ps=true;psx=ev.clientX;psy=ev.clientY;ppx=panX;ppy=panY;board.classList.add("panning");board.setPointerCapture(ev.pointerId);});
board.addEventListener("pointermove",ev=>{ if(!ps)return; panX=ppx+(ev.clientX-psx);panY=ppy+(ev.clientY-psy);applyView();});
board.addEventListener("pointerup",()=>{ps=false;board.classList.remove("panning");});
board.addEventListener("wheel",ev=>{ ev.preventDefault(); zoomAt(zoom*Math.pow(1.15,-Math.sign(ev.deltaY)),ev.clientX,ev.clientY); },{passive:false});
$("#zIn").addEventListener("click",()=>zoomAt(zoom*1.2,innerWidth/2,innerHeight/2));
$("#zOut").addEventListener("click",()=>zoomAt(zoom*.85,innerWidth/2,innerHeight/2));
$("#fit").addEventListener("click",()=>{ zoom=1; panX=innerWidth/2-root.x; panY=innerHeight/2-root.y; applyView(); });
$("#addBranch").addEventListener("click",()=>{ const t=prompt("Название ветви:","Новая ветвь"); if(t&&t.trim()){ root.children.push({id:nid(),kind:"branch",txt:t.trim(),children:[]}); saveAll(); render(true); } });
$("#titleInput").addEventListener("change",saveAll);
addEventListener("resize",()=>{svg.setAttribute("width",innerWidth*2);svg.setAttribute("height",innerHeight*2);render(false);});

loadAll();
if(!nodes.length){ seed(); }
// default view if never saved
if(!loaded){ panX=innerWidth/2-root.x; panY=innerHeight/2-root.y; }
render(true);
$("#fit").click();
</script>
</body>
</html>
